# Map untuk upgrade WebSocket/SSE — level http (di luar server block), wajib
# karena `map` tidak dapat dideklarasi di dalam konteks server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Seluruh /api (termasuk SSE, streaming chat, upload) diteruskan ke backend.
  # Buffering dimatikan dan timeout panjang agar stream tidak terputus.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_store off;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no always;
  }

  location / {
    try_files $uri /index.html;
  }
}