# TEMPLATE ONLY. Include in nginx http{} as replacement of the existing MIH site,
# NOT alongside it. Never apply until docs/tunnel-office.md gates pass.
# HTTP remains served without redirect to preserve current edge TLS topology.
map $http_upgrade $mih_office_connection {
    default upgrade;
    '' close;
}
# Never trust arbitrary inbound X-Forwarded-Proto. For HTTP edge traffic the
# browser-facing MIH site is HTTPS; edge must enforce HTTPS and bypass caching.
map $scheme $mih_office_proto {
    default https;
}

server {
    listen 80;
    listen [::]:80;
    server_name mih.keuanganppn1.cloud;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 502 503 504 =503 @mih_maintenance;

    # Single origin for SPA, uploads, /api, SSE and streamed chat. Preserve URI.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mih_office_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mih_office_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_store off;
        gzip off;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        add_header X-Accel-Buffering no always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Generated locally; no dependency on a file or stale VPS application.
    location @mih_maintenance {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 503 "MIH kantor sementara tidak tersedia. Silakan coba kembali.\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mih.keuanganppn1.cloud;
    # Observed existing certificate has SAN for MIH and remote hostname.
    ssl_certificate /etc/letsencrypt/live/remote.keuanganppn1.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.keuanganppn1.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
