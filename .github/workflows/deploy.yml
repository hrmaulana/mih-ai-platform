name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-office
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build-frontend-artifact:
    name: Build exact tested revision on GitHub
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Record tested SHA
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          printf 'sha=%s\n' "$TESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Deployment safety tests
        run: python3 -m unittest discover -s tests -p test_office_deployment.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Bind artifact to tested SHA
        env:
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > frontend/dist/.mih-release-sha
          cd frontend/dist
          find . -type f ! -name .mih-release-sha ! -name .mih-release-checksums -print0 | sort -z | xargs -0 sha256sum > .mih-release-checksums
      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ steps.revision.outputs.sha }}
          path: frontend/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-office:
    name: Office keuanganpmp only (10.2.17.186)
    if: ${{ vars.MIH_OFFICE_DEPLOY_ENABLED == 'true' }}
    # Explicit prerequisite: register this unique label; never target generic runners.
    runs-on: [self-hosted, Linux, X64, mih-office-keuanganpmp]
    timeout-minutes: 60
    needs: build-frontend-artifact
    # Configure required reviewers AND prevent self-review before enabling runner.
    environment: office-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build-frontend-artifact.outputs.sha }}
          persist-credentials: false
      - name: Download frontend artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist-${{ needs.build-frontend-artifact.outputs.sha }}
          path: ${{ runner.temp }}/mih-frontend-${{ needs.build-frontend-artifact.outputs.sha }}
      - name: Deploy guarded exact revision
        env:
          MIH_OFFICE_DEPLOY_ENABLED: ${{ vars.MIH_OFFICE_DEPLOY_ENABLED }}
          TESTED_SHA: ${{ needs.build-frontend-artifact.outputs.sha }}
          FRONTEND_ARTIFACT: ${{ runner.temp }}/mih-frontend-${{ needs.build-frontend-artifact.outputs.sha }}
        run: bash scripts/deploy.sh "$TESTED_SHA" "$FRONTEND_ARTIFACT" --apply

# VPS is proxy-only. No VPS app build, migrations, restart, nginx or tunnel edits.
